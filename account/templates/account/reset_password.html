{% extends "ownerbase.html" %}

{% block title %}
    Reset Password | Himal Vet Care
{% endblock %}

{% block content %}

<div class="min-h-[70vh] flex items-center justify-center">

    <div class="w-full max-w-md">

        <div class="bg-white rounded-2xl
                    border border-slate-200
                    shadow-sm p-6 sm:p-8">

            <!-- Icon -->
            <div class="flex justify-center mb-5">

                <div class="w-14 h-14
                            rounded-full
                            bg-pink-100
                            text-pink-500
                            flex items-center
                            justify-center">

                    <i class="fa-solid fa-lock text-xl"></i>

                </div>

            </div>


            <!-- Heading -->
            <div class="text-center mb-6">

                <h1 class="text-2xl font-bold text-slate-900">
                    Reset Password
                </h1>

                <p class="text-sm text-slate-500 mt-2">
                    Enter your new password below.
                </p>

            </div>


            <!-- Messages -->
            {% if messages %}

                <div class="space-y-2 mb-5">

                    {% for message in messages %}

                        <div class="px-4 py-3 rounded-xl
                                    bg-red-50
                                    border border-red-200
                                    text-red-600
                                    text-sm">

                            {{ message }}

                        </div>

                    {% endfor %}

                </div>

            {% endif %}


            <!-- Reset Form -->
            <form method="POST"
                  class="space-y-5">

                {% csrf_token %}


                <!-- New Password -->
                <div>

                    <label class="block text-sm font-medium
                                  text-slate-700 mb-2">

                        New Password

                    </label>

                    <div class="relative">

                        <input
                            type="password"
                            name="password"
                            required
                            minlength="8"
                            placeholder="Enter new password"
                            class="w-full rounded-xl
                                   border border-slate-300
                                   px-4 py-3 pr-11
                                   focus:outline-none
                                   focus:ring-2
                                   focus:ring-pink-400"
                        >

                        <i class="fa-solid fa-lock
                                  absolute right-4 top-1/2
                                  -translate-y-1/2
                                  text-slate-400">
                        </i>

                    </div>

                </div>


                <!-- Confirm Password -->
                <div>

                    <label class="block text-sm font-medium
                                  text-slate-700 mb-2">

                        Confirm Password

                    </label>

                    <div class="relative">

                        <input
                            type="password"
                            name="confirm_password"
                            required
                            minlength="8"
                            placeholder="Confirm new password"
                            class="w-full rounded-xl
                                   border border-slate-300
                                   px-4 py-3 pr-11
                                   focus:outline-none
                                   focus:ring-2
                                   focus:ring-pink-400"
                        >

                        <i class="fa-solid fa-lock
                                  absolute right-4 top-1/2
                                  -translate-y-1/2
                                  text-slate-400">
                        </i>

                    </div>

                </div>


                <!-- Button -->
                <button
                    type="submit"
                    class="w-full
                           bg-pink-500
                           hover:bg-pink-600
                           text-white
                           font-medium
                           py-3
                           rounded-xl
                           transition">

                    <i class="fa-solid fa-key mr-2"></i>

                    Reset Password

                </button>


                <!-- Login -->
                <div class="text-center pt-2">

                    <a href="{% url 'login' %}"
                       class="text-sm
                              text-pink-500
                              hover:text-pink-600
                              font-medium">

                        <i class="fa-solid fa-arrow-left mr-1"></i>
                        Back to Login

                    </a>

                </div>

            </form>

        </div>

    </div>

</div>

{% endblock %}
