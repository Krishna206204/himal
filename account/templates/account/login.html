<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Login - Himal Vet Care</title>


    <!-- Tailwind CSS -->
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>


    <!-- Font Awesome -->
    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">


    <!-- Google Font -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600&display=swap"
          rel="stylesheet">


    <style>

        body {
            font-family: 'Poppins', sans-serif;
        }

    </style>

</head>


<body
    class="min-h-screen flex items-center justify-center
           bg-cover bg-center bg-fixed relative p-5"

    style="
        background-image:
        url('https://images.unsplash.com/photo-1576201836106-db1758fd1c97?q=80&w=1920');
    "
>


    <!-- Background Overlay -->

    <div
        class="fixed inset-0
               bg-gradient-to-t
               from-[#2b1055]
               to-[#7597de]
               opacity-70
               z-0">
    </div>


    <!-- Login Container -->

    <div
        class="relative z-10
               w-full
               max-w-[380px]
               p-2.5
               sm:p-5"
    >


        <!-- Login Card -->

        <div
            class="w-full
                   px-6 py-8
                   sm:px-8 sm:py-10
                   rounded-2xl
                   bg-white/15
                   backdrop-blur-[15px]
                   border border-white/30
                   text-center
                   text-white
                   shadow-[0_0_30px_rgba(0,0,0,0.4)]"
        >


            <!-- =========================================
                 BACK TO HOME BUTTON
            ========================================== -->

            <div class="flex justify-start mb-5">

                <a
                    href="{% url 'home' %}"

                    class="inline-flex
                           items-center
                           gap-2
                           rounded-full
                           border border-white/30
                           bg-amber-400
                           px-4
                           py-2
                           text-sm
                           font-medium
                           text-white
                           backdrop-blur-sm
                           transition-all
                           duration-300

                           hover:bg-white
                           hover:text-slate-800
                           hover:-translate-y-0.5
                           hover:shadow-lg"
                >

                    <i class="fa-solid fa-arrow-left"></i>

                    <span>
                        Home
                    </span>

                </a>

            </div>


            <!-- Login Heading -->

            <h2
                class="mb-7
                       text-3xl
                       font-semibold"
            >
                Login
            </h2>


            <!-- Login Form -->

            <form
                method="POST"
                action="{% url 'login' %}"
                class="space-y-5"
            >

                {% csrf_token %}


                <!-- Email -->

                <div class="relative">

                    <input
                        type="email"
                        name="email"
                        placeholder="Email Address"
                        required
                        autocomplete="email"

                        class="w-full
                               px-4
                               pr-11
                               py-3
                               rounded-full
                               border border-white/30
                               bg-white/10
                               text-white
                               placeholder:text-slate-200
                               outline-none
                               transition

                               focus:border-white/80
                               focus:bg-white/15
                               focus:ring-2
                               focus:ring-white/10"
                    >


                    <!-- Email Icon -->

                    <i
                        class="fa-solid fa-envelope
                               absolute
                               right-4
                               top-1/2
                               -translate-y-1/2
                               text-white
                               pointer-events-none"
                    ></i>

                </div>


                <!-- Password -->

                <div class="relative">

                    <input
                        type="password"
                        name="password"
                        id="password"
                        placeholder="Password"
                        required
                        autocomplete="current-password"

                        class="w-full
                               px-4
                               pr-11
                               py-3
                               rounded-full
                               border border-white/30
                               bg-white/10
                               text-white
                               placeholder:text-slate-200
                               outline-none
                               transition

                               focus:border-white/80
                               focus:bg-white/15
                               focus:ring-2
                               focus:ring-white/10"
                    >


                    <!-- Password Icon -->

                    <i
                        id="password-icon"

                        class="fa-solid fa-lock
                               absolute
                               right-4
                               top-1/2
                               -translate-y-1/2
                               text-white
                               cursor-pointer
                               transition
                               hover:text-yellow-300"
                    ></i>

                </div>


                <!-- Login Button -->

                <button
                    type="submit"

                    class="w-full
                           py-3
                           rounded-full
                           bg-white
                           text-slate-800
                           font-bold
                           transition-all
                           duration-300
                           cursor-pointer

                           hover:bg-[#ff6a00]
                           hover:text-white
                           hover:-translate-y-0.5
                           hover:shadow-lg"
                >

                    Login

                </button>


                <!-- Register -->

                <p
                    class="mt-4
                           text-sm
                           text-white"
                >

                    Don't have an account?

                    <a
                        href="{% url 'register' %}"

                        class="text-yellow-300
                               font-medium
                               hover:underline"
                    >

                        Register

                    </a>

                </p>


            </form>

        </div>

    </div>


    <!-- =========================================
         PASSWORD SHOW / HIDE
    ========================================== -->

    <script>

        const passwordInput =
            document.getElementById("password");

        const passwordIcon =
            document.getElementById("password-icon");


        passwordIcon.addEventListener("click", function () {

            if (passwordInput.type === "password") {

                passwordInput.type = "text";

                passwordIcon.classList.remove("fa-lock");

                passwordIcon.classList.add("fa-eye");

            } else {

                passwordInput.type = "password";

                passwordIcon.classList.remove("fa-eye");

                passwordIcon.classList.add("fa-lock");

            }

        });

    </script>


</body>

</html>
