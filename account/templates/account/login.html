<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Himal Vet Care</title>

    <!-- Tailwind CSS -->
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>

    <!-- Font Awesome -->
    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <!-- Google Font -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600&display=swap"
          rel="stylesheet">

    <style>
        body {
            font-family: 'Poppins', sans-serif;
        }
    </style>
</head>

<body
    class="min-h-screen flex items-center justify-center
           bg-cover bg-center bg-fixed relative p-5"
    style="background-image: url('https://images.unsplash.com/photo-1576201836106-db1758fd1c97?q=80&w=1920');"
>

    <!-- Background Overlay -->
    <div class="fixed inset-0 bg-gradient-to-t from-[#2b1055] to-[#7597de] opacity-70 z-0"></div>

    <!-- Main Container -->
    <div class="relative z-10 w-full max-w-[380px] p-2.5 sm:p-5">

        <!-- Login Box -->
        <div
            class="w-full px-6 py-10 sm:px-8
                   rounded-2xl
                   bg-white/15
                   backdrop-blur-[15px]
                   border border-white/30
                   text-center text-white
                   shadow-[0_0_30px_rgba(0,0,0,0.4)]"
        >

            <!-- Heading -->
            <h2 class="mb-7 text-3xl font-semibold">
                Login
            </h2>

            <!-- Django Messages -->
            {% if messages %}
            <ul class="mb-4 space-y-2">
                {% for message in messages %}
                <li
                    class="bg-red-500/30
                           border border-red-400/60
                           text-red-100
                           px-3 py-2
                           rounded-lg
                           text-xs"
                >
                    {{ message }}
                </li>
                {% endfor %}
            </ul>
            {% endif %}

            <!-- Login Form -->
            <form method="POST"
                  action="{% url 'login' %}"
                  class="space-y-5">

                {% csrf_token %}

                <!-- Username -->
                <div class="relative">
                    <input
                        type="text"
                        name="username"
                        placeholder="Username"
                        required
                        autocomplete="username"
                        class="w-full
                               px-4 pr-11 py-3
                               rounded-full
                               border border-white/30
                               bg-white/10
                               text-white
                               placeholder:text-slate-200
                               outline-none
                               transition
                               focus:border-white/80
                               focus:bg-white/15
                               focus:ring-2
                               focus:ring-white/10"
                    >

                    <i
                        class="fa-solid fa-user
                               absolute right-4 top-1/2
                               -translate-y-1/2
                               text-white
                               pointer-events-none"
                    ></i>
                </div>

                <!-- Password -->
                <div class="relative">
                    <input
                        type="password"
                        name="password"
                        placeholder="Password"
                        required
                        autocomplete="current-password"
                        class="w-full
                               px-4 pr-11 py-3
                               rounded-full
                               border border-white/30
                               bg-white/10
                               text-white
                               placeholder:text-slate-200
                               outline-none
                               transition
                               focus:border-white/80
                               focus:bg-white/15
                               focus:ring-2
                               focus:ring-white/10"
                    >

                    <i
                        class="fa-solid fa-lock
                               absolute right-4 top-1/2
                               -translate-y-1/2
                               text-white
                               pointer-events-none"
                    ></i>
                </div>

                <!-- Login Button -->
                <button
                    type="submit"
                    class="w-full
                           py-3
                           rounded-full
                           bg-white
                           text-slate-800
                           font-bold
                           transition-all
                           duration-300
                           cursor-pointer
                           hover:bg-[#ff6a00]
                           hover:text-white
                           hover:-translate-y-0.5"
                >
                    Login
                </button>

                <!-- Register -->
                <p class="mt-4 text-sm text-white">
                    Don't have an account?

                    <a
                        href="{% url 'register' %}"
                        class="text-yellow-300
                               font-medium
                               hover:underline"
                    >
                        Register
                    </a>
                </p>

                <!-- Vet Login -->
                <a
                    href="{% url 'vet-login' %}"
                    class="mt-4
                           flex items-center justify-center gap-2
                           w-full py-3
                           rounded-full
                           border border-white/40
                           bg-white/10
                           text-white
                           font-semibold text-sm
                           transition-all duration-300
                           hover:bg-[#ff6a00]
                           hover:border-[#ff6a00]
                           hover:-translate-y-0.5"
                >
                    <i class="fa-solid fa-user-doctor"></i>
                    Vet Login
                </a>

            </form>

        </div>

    </div>

</body>
</html>
