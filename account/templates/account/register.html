<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pet Owner Registration - Himal Vet Care</title>

    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600&display=swap"
          rel="stylesheet">

    <style>
        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
            font-family:'Poppins',sans-serif;
        }

        body{
            min-height:100vh;
            display:flex;
            justify-content:center;
            align-items:center;
            background:url('https://images.unsplash.com/photo-1576201836106-db1758fd1c97?q=80&w=1920')
            no-repeat center center;
            background-size:cover;
            position:relative;
            padding:30px 0;
        }

        body::before{
            content:"";
            position:absolute;
            width:100%;
            height:100%;
            background:linear-gradient(to top,#2b1055,#7597de);
            opacity:.75;
            z-index:0;
        }

        .container{
            position:relative;
            z-index:1;
            width:100%;
            max-width:450px;
            padding:20px;
        }

        .register-box{
            padding:35px 30px;
            border-radius:15px;
            background:rgba(255,255,255,.15);
            backdrop-filter:blur(15px);
            -webkit-backdrop-filter:blur(15px);
            border:1px solid rgba(255,255,255,.3);
            color:white;
            text-align:center;
            box-shadow:0 0 30px rgba(0,0,0,.4);
        }

        .register-box h2{
            margin-bottom:20px;
            font-size:28px;
        }

        .alert-messages{
            list-style:none;
            margin-bottom:15px;
        }

        .alert-messages li{
            padding:10px;
            border-radius:8px;
            margin-bottom:8px;
            background:rgba(239,68,68,.25);
            border:1px solid rgba(239,68,68,.5);
            color:#ffe1e1;
            font-size:14px;
        }

        .success{
            background:rgba(34,197,94,.25) !important;
            border:1px solid rgba(34,197,94,.5) !important;
            color:#d8ffe3 !important;
        }

        .input-box{
            position:relative;
            margin:18px 0;
        }

        .input-box input{
            width:100%;
            padding:12px 45px 12px 15px;
            border-radius:30px;
            border:1px solid rgba(255,255,255,.3);
            outline:none;
            background:rgba(255,255,255,.1);
            color:white;
            font-size:14px;
        }

        .input-box input::placeholder{
            color:transparent;
        }

        .input-box label{
            position:absolute;
            top:50%;
            left:15px;
            transform:translateY(-50%);
            color:#ddd;
            transition:.3s;
            pointer-events:none;
        }

        .input-box input:focus ~ label,
        .input-box input:not(:placeholder-shown) ~ label{
            top:-8px;
            left:10px;
            font-size:11px;
            color:white;
            background:rgba(43,16,85,.7);
            padding:2px 8px;
            border-radius:10px;
        }

        .input-box i{
            position:absolute;
            right:15px;
            top:50%;
            transform:translateY(-50%);
            color:white;
        }

        .btn{
            width:100%;
            padding:12px;
            border:none;
            border-radius:30px;
            background:white;
            color:#333;
            font-weight:600;
            cursor:pointer;
            transition:.3s;
            margin-top:10px;
        }

        .btn:hover{
            background:#ff6a00;
            color:white;
        }

        p{
            margin-top:18px;
            font-size:14px;
        }

        p a{
            color:#ffd700;
            text-decoration:none;
        }

        p a:hover{
            text-decoration:underline;
        }

        .logo{
            margin-bottom:10px;
            font-size:42px;
            color:#ffd700;
        }

        .subtitle{
            font-size:14px;
            margin-bottom:20px;
            color:#f0f0f0;
        }
    </style>
</head>
<body>

<div class="container">
    <div class="register-box">

        <div class="logo">
            <i class="fa-solid fa-paw"></i>
        </div>

        <h2>Create Pet Owner Account</h2>

        <div class="subtitle">
            Join Himal Vet Care and manage your pets easily.
        </div>

        {% if messages %}
            <ul class="alert-messages">
                {% for message in messages %}
                    <li class="{% if message.tags == 'success' %}success{% endif %}">
                        {{ message }}
                    </li>
                {% endfor %}
            </ul>
        {% endif %}

        <form method="POST">
            {% csrf_token %}

            <div class="input-box">
                <input type="text"
                       name="username"
                       placeholder=" "
                       required
                       autocomplete="off">
                <label>Username</label>
                <i class="fa-solid fa-user"></i>
            </div>

            <div class="input-box">
                <input type="email"
                       name="email"
                       placeholder=" "
                       required>
                <label>Email Address</label>
                <i class="fa-solid fa-envelope"></i>
            </div>

            <div class="input-box">
                <input type="text"
                       name="phone"
                       placeholder=" ">
                <label>Phone Number</label>
                <i class="fa-solid fa-phone"></i>
            </div>

            <div class="input-box">
                <input type="password"
                       name="password"
                       placeholder=" "
                       required>
                <label>Password</label>
                <i class="fa-solid fa-lock"></i>
            </div>

            <div class="input-box">
                <input type="password"
                       name="confirm_password"
                       placeholder=" "
                       required>
                <label>Confirm Password</label>
                <i class="fa-solid fa-shield-halved"></i>
            </div>

            <button type="submit" class="btn">
                Register
            </button>

            <p>
                Already have an account?
                <a href="{% url 'login' %}">
                    Login
                </a>
            </p>

        </form>

    </div>
</div>

</body>
</html>
