{% extends "ownerbase.html" %}

{% block title %}
    Add Pet | Vet Care
{% endblock %}

{% block content %}

<div class="max-w-3xl mx-auto">

    <div class="mb-6">

        <h1 class="text-2xl font-bold text-slate-900">
            Add New Pet
        </h1>

        <p class="text-sm text-slate-500 mt-1">
            Enter your pet's information below.
        </p>

    </div>


    <div class="bg-white rounded-2xl
                border border-slate-200
                shadow-sm p-6 sm:p-8">

        <form method="POST"
              action="{% url 'add_animal' %}"
              class="space-y-5">

            {% csrf_token %}


            <!-- Name -->
            <div>

                <label class="block text-sm font-medium
                              text-slate-700 mb-2">

                    Pet Name

                </label>

                <input type="text"
                       name="name"
                       required
                       placeholder="Enter pet name"
                       class="w-full rounded-xl
                              border border-slate-300
                              px-4 py-3
                              focus:outline-none
                              focus:ring-2
                              focus:ring-pink-400">

            </div>


            <!-- Species -->
            <div>

                <label class="block text-sm font-medium
                              text-slate-700 mb-2">

                    Species

                </label>

                <input type="text"
                       name="species"
                       required
                       placeholder="e.g. Dog, Cat"
                       class="w-full rounded-xl
                              border border-slate-300
                              px-4 py-3
                              focus:outline-none
                              focus:ring-2
                              focus:ring-pink-400">

            </div>


            <!-- Breed -->
            <div>

                <label class="block text-sm font-medium
                              text-slate-700 mb-2">

                    Breed

                </label>

                <input type="text"
                       name="breed"
                       placeholder="Enter breed"
                       class="w-full rounded-xl
                              border border-slate-300
                              px-4 py-3
                              focus:outline-none
                              focus:ring-2
                              focus:ring-pink-400">

            </div>


            <!-- Age -->
            <div>

                <label class="block text-sm font-medium
                              text-slate-700 mb-2">

                    Age

                </label>

                <input type="number"
                       name="age"
                       min="0"
                       placeholder="Age in years"
                       class="w-full rounded-xl
                              border border-slate-300
                              px-4 py-3
                              focus:outline-none
                              focus:ring-2
                              focus:ring-pink-400">

            </div>


            <!-- Problem / Symptoms -->
            <div>

                <label class="block text-sm font-medium
                              text-slate-700 mb-2">

                    Problem / Symptoms

                </label>

                <textarea name="symptoms"
                          rows="4"
                          placeholder="Describe the problem or symptoms of your pet..."
                          class="w-full rounded-xl
                                 border border-slate-300
                                 px-4 py-3
                                 resize-none
                                 focus:outline-none
                                 focus:ring-2
                                 focus:ring-pink-400"></textarea>

                <p class="text-xs text-slate-400 mt-2">
                    Describe any illness, injury, unusual behavior,
                    pain, loss of appetite, fever, or other symptoms.
                </p>

            </div>


            <!-- Buttons -->
            <div class="flex gap-3 pt-4">

                <a href="{% url 'animal_list' %}"
                   class="flex-1 text-center
                          px-5 py-3 rounded-xl
                          bg-slate-100 text-slate-700
                          hover:bg-slate-200">

                    Cancel

                </a>


                <button type="submit"
                        class="flex-1 px-5 py-3
                               rounded-xl
                               bg-pink-500 text-white
                               font-medium
                               hover:bg-pink-600">

                    <i class="fa-solid fa-plus mr-2"></i>

                    Add Pet

                </button>

            </div>

        </form>

    </div>

</div>

{% endblock %}
