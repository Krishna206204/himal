{% extends "ownerbase.html" %}

{% block title %}
    Delete Pet | Vet Care
{% endblock %}

{% block content %}

<div class="max-w-lg mx-auto">

    <div class="bg-white rounded-2xl
                border border-slate-200
                shadow-sm p-6 sm:p-8 text-center">

        <!-- Icon -->
        <div class="w-20 h-20 mx-auto
                    rounded-full bg-red-100
                    flex items-center justify-center
                    text-red-500 text-3xl">

            <i class="fa-solid fa-trash"></i>

        </div>


        <h1 class="text-2xl font-bold
                   text-slate-900 mt-5">

            Delete {{ animal.name }}?

        </h1>


        <p class="text-slate-500 mt-3">

            Are you sure you want to delete this pet?

            <br>

            This action cannot be undone.

        </p>


        <!-- Delete Form -->
        <form method="POST"
              action="{% url 'delete_animal' animal.id %}"
              class="mt-6">

            {% csrf_token %}

            <div class="flex gap-3">

                <a href="{% url 'animal_list' %}"
                   class="flex-1 px-5 py-3
                          rounded-xl
                          bg-slate-100
                          text-slate-700
                          hover:bg-slate-200">

                    Cancel

                </a>


                <button type="submit"
                        class="flex-1 px-5 py-3
                               rounded-xl
                               bg-red-500
                               text-white
                               font-medium
                               hover:bg-red-600">

                    <i class="fa-solid fa-trash mr-2"></i>

                    Delete

                </button>

            </div>

        </form>

    </div>

</div>

{% endblock %}
