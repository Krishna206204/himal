<div class="table-wrap">
    <table>
        <thead><tr><th>Date</th><th>Pet</th><th>Veterinarian</th><th>Status</th></tr></thead>
        <tbody>
        {% for appt in appointments %}
            <tr><td>{{ appt.appointment_date|date:"M j, Y · H:i" }}</td><td><a href="{% url 'pet_detail' appt.animal_id %}">{{ appt.animal.name }}</a></td><td>Dr. {{ appt.veterinarian.get_full_name|default:appt.veterinarian.username }}</td><td><span class="status">{{ appt.get_status_display }}</span></td></tr>
        {% empty %}<tr><td colspan="4" class="muted">Nothing scheduled yet.</td></tr>{% endfor %}
        </tbody>
    </table>
</div>
