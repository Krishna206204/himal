<!-- Overlay -->
<div id="vet-overlay"
     class="hidden fixed inset-0
            bg-slate-950/50 backdrop-blur-sm
            z-40 lg:hidden">
</div>


<!-- Sidebar -->
<aside id="vet-sidebar"
       class="fixed lg:sticky
              top-0 left-0 z-50
              w-72 h-screen
              bg-slate-950 text-white
              flex flex-col
              transform -translate-x-full
              lg:translate-x-0
              transition-transform duration-300
              shadow-2xl">


    <!-- Logo -->
    <div class="px-6 py-6
                border-b border-white/10
                bg-slate-950">

        <div class="flex items-center gap-3">

            <div class="w-11 h-11
                        rounded-xl
                        bg-emerald-600
                        shadow-lg shadow-emerald-600/20
                        flex items-center justify-center
                        shrink-0">

                <i class="fa-solid fa-paw text-xl"></i>

            </div>

            <div class="min-w-0">

                <h2 class="font-bold text-lg
                           text-white
                           leading-tight">

                    Vet Care

                </h2>

                <p class="text-xs
                          text-slate-400
                          mt-1">

                    Veterinarian Portal

                </p>

            </div>

        </div>

    </div>


    <!-- Veterinarian Profile -->
    <div class="px-5 py-5
                border-b border-white/10
                bg-slate-950">

        <div class="flex items-center gap-3">

            <div class="flex items-center justify-center">

            </div>

        </div>

    </div>


    <!-- Navigation -->
    <nav class="flex-1
                overflow-y-auto
                px-4 py-5
                scrollbar-thin
                scrollbar-thumb-slate-700
                scrollbar-track-transparent">

        <p class="px-3 mb-3
                  text-xs font-semibold
                  uppercase tracking-wider
                  text-slate-500">

            Veterinary Menu

        </p>


        <ul class="space-y-1">


            <li>

                <a href="{% url 'vet-dashboard' %}"
                   class="group
                          flex items-center gap-3
                          px-4 py-3
                          rounded-xl
                          text-slate-300
                          hover:bg-emerald-600
                          hover:text-white
                          hover:shadow-lg
                          hover:shadow-emerald-600/20
                          transition-all duration-200">

                    <i class="fa-solid fa-house
                              w-5
                              text-center
                              text-slate-400
                              group-hover:text-white
                              transition-colors">
                    </i>

                    <span class="font-medium">
                        Dashboard
                    </span>

                </a>

            </li>


            <li>

                <a href="{% url 'vet-appointments' %}"
                   class="group
                          flex items-center gap-3
                          px-4 py-3
                          rounded-xl
                          text-slate-300
                          hover:bg-emerald-600
                          hover:text-white
                          hover:shadow-lg
                          hover:shadow-emerald-600/20
                          transition-all duration-200">

                    <i class="fa-solid fa-calendar-check
                              w-5
                              text-center
                              text-slate-400
                              group-hover:text-white
                              transition-colors">
                    </i>

                    <span class="font-medium">
                        Appointments
                    </span>

                </a>

            </li>


            <li>

                <a href="{% url 'create-medical-record' %}"
                   class="group
                          flex items-center gap-3
                          px-4 py-3
                          rounded-xl
                          text-slate-300
                          hover:bg-emerald-600
                          hover:text-white
                          hover:shadow-lg
                          hover:shadow-emerald-600/20
                          transition-all duration-200">

                    <i class="fa-solid fa-file-medical
                              w-5
                              text-center
                              text-slate-400
                              group-hover:text-white
                              transition-colors">
                    </i>

                    <span class="font-medium">
                        Medical Records
                    </span>

                </a>

            </li>


            <li>

                <a href="#"
                   class="group
                          flex items-center gap-3
                          px-4 py-3
                          rounded-xl
                          text-slate-300
                          hover:bg-emerald-600
                          hover:text-white
                          hover:shadow-lg
                          hover:shadow-emerald-600/20
                          transition-all duration-200">

                    <i class="fa-solid fa-paw
                              w-5
                              text-center
                              text-slate-400
                              group-hover:text-white
                              transition-colors">
                    </i>

                    <span class="font-medium">
                        My Patients
                    </span>

                </a>

            </li>


            <li>

                <a href="#"
                   class="group
                          flex items-center gap-3
                          px-4 py-3
                          rounded-xl
                          text-slate-300
                          hover:bg-emerald-600
                          hover:text-white
                          hover:shadow-lg
                          hover:shadow-emerald-600/20
                          transition-all duration-200">

                    <i class="fa-solid fa-notes-medical
                              w-5
                              text-center
                              text-slate-400
                              group-hover:text-white
                              transition-colors">
                    </i>

                    <span class="font-medium">
                        Prescriptions
                    </span>

                </a>

            </li>


        </ul>

    </nav>


    <!-- Logout -->
    <div class="p-4
                border-t border-white/10
                bg-slate-950">

        <a href="{% url 'logout' %}"
           class="group
                  flex items-center gap-3
                  px-4 py-3
                  rounded-xl
                  text-red-400
                  hover:bg-red-500/10
                  hover:text-red-300
                  transition-all duration-200">

            <i class="fa-solid fa-right-from-bracket
                      w-5
                      text-center
                      group-hover:translate-x-0.5
                      transition-transform">
            </i>

            <span class="font-medium">
                Logout
            </span>

        </a>

    </div>


</aside>
