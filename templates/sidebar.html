<aside class="sidebar">
    <div>
        <h2 class="brand">Himal Vet Care<span>Patient management</span></h2>
        <nav class="nav-links" aria-label="Main navigation">
            <a href="{% url 'dashboard' %}">Dashboard</a>
            <a href="{% url 'pet_list' %}">{% if user.role == 'PET_OWNER' %}My pets{% else %}Patients{% endif %}</a>
            <a href="{% url 'appointment_list' %}">Appointments</a>
            <a href="{% url 'medical_record_list' %}">Medical records</a>
            {% if user.is_staff or user.is_superuser %}
                <a href="/admin/">Administration</a>
            {% endif %}
        </nav>
    </div>
    <form class="logout-form" method="post" action="{% url 'logout' %}">
        {% csrf_token %}
        <button type="submit">Sign out ({{ user.username }})</button>
    </form>
</aside>
