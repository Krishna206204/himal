<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Choose a new password | Himal Vet Care</title></head>
<body><main><h1>Choose a new password</h1>{% if validlink %}<form method="post">{% csrf_token %}{{ form.as_p }}<button type="submit">Update password</button></form>{% else %}<p>This password reset link is invalid or has expired. Request a new one.</p><a href="{% url 'forgot_password' %}">Request another link</a>{% endif %}</main></body></html>
