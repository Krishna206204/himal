<!-- Mobile Overlay -->
<div id="admin-overlay"
     class="hidden fixed inset-0 bg-black/40 z-40 lg:hidden">
</div>


<!-- Sidebar -->
<aside id="admin-sidebar"
       class="fixed lg:sticky top-0 left-0 z-50
              w-72 h-screen
              bg-slate-950 text-white
              flex flex-col
              transform -translate-x-full
              lg:translate-x-0
              transition-transform duration-300">

    <!-- Logo -->
    <div class="px-6 py-6 border-b border-white/10">

        <div class="flex items-center gap-3">

            <div class="w-11 h-11 rounded-xl
                        bg-indigo-600
                        flex items-center justify-center">

                <i class="fa-solid fa-paw text-xl"></i>

            </div>

            <div>

                <h2 class="font-bold text-lg">
                    Vet Care
                </h2>

                <p class="text-xs text-slate-400">
                    Management System
                </p>

            </div>

        </div>

    </div>


    <!-- User -->
    <div class="px-5 py-5 border-b border-white/10">

        <div class="flex items-center gap-3">

            <div class="w-11 h-11 rounded-full
                        bg-indigo-500
                        flex items-center justify-center">

                <i class="fa-solid fa-user-shield"></i>

            </div>

            <div class="min-w-0">

                <p class="font-semibold truncate">

                    {{ request.user.get_full_name|default:request.user.username }}

                </p>

                <p class="text-xs text-slate-400">
                    Administrator
                </p>

            </div>

        </div>

    </div>


    <!-- Navigation -->
    <nav class="flex-1 overflow-y-auto px-4 py-5">

        <p class="px-3 mb-3 text-xs font-semibold
                  uppercase tracking-wider text-slate-500">

            Main Menu

        </p>


        <ul class="space-y-1">

            <li>

                <a href="{% url 'dashboard' %}"
                   class="flex items-center gap-3
                          px-4 py-3 rounded-xl
                          text-slate-300
                          hover:bg-indigo-600
                          hover:text-white
                          transition">

                    <i class="fa-solid fa-chart-line w-5"></i>

                    <span>Dashboard</span>

                </a>

            </li>


            <li>

                <a href="#"
                   class="flex items-center gap-3
                          px-4 py-3 rounded-xl
                          text-slate-300
                          hover:bg-indigo-600
                          hover:text-white
                          transition">

                    <i class="fa-solid fa-users w-5"></i>

                    <span>Manage Users</span>

                </a>

            </li>


            <li>

                <a href="#"
                   class="flex items-center gap-3
                          px-4 py-3 rounded-xl
                          text-slate-300
                          hover:bg-indigo-600
                          hover:text-white
                          transition">

                    <i class="fa-solid fa-user-doctor w-5"></i>

                    <span>Veterinarians</span>

                </a>

            </li>


            <li>

                <a href="#"
                   class="flex items-center gap-3
                          px-4 py-3 rounded-xl
                          text-slate-300
                          hover:bg-indigo-600
                          hover:text-white
                          transition">

                    <i class="fa-solid fa-paw w-5"></i>

                    <span>Pet Owners</span>

                </a>

            </li>


            <li>

                <a href="#"
                   class="flex items-center gap-3
                          px-4 py-3 rounded-xl
                          text-slate-300
                          hover:bg-indigo-600
                          hover:text-white
                          transition">

                    <i class="fa-solid fa-calendar-check w-5"></i>

                    <span>Appointments</span>

                </a>

            </li>


            <li>

                <a href="#"
                   class="flex items-center gap-3
                          px-4 py-3 rounded-xl
                          text-slate-300
                          hover:bg-indigo-600
                          hover:text-white
                          transition">

                    <i class="fa-solid fa-file-medical w-5"></i>

                    <span>Medical Records</span>

                </a>

            </li>

        </ul>

    </nav>


    <!-- Footer -->
    <div class="p-4 border-t border-white/10">

        <a href="{% url 'logout' %}"
           class="flex items-center gap-3
                  px-4 py-3 rounded-xl
                  text-red-400
                  hover:bg-red-500/10
                  transition">

            <i class="fa-solid fa-right-from-bracket w-5"></i>

            <span>Logout</span>

        </a>

    </div>

</aside>
