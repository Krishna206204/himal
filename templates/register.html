<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register - Himal Vet Care</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">

    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Poppins', sans-serif; }
        
        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: url("https://images.unsplash.com/photo-1576201836106-db1758fd1c97?q=80&w=1920") no-repeat center;
            background-size: cover;
            position: relative;
            padding: 30px 0;
        }

        body::before {
            content: "";
            position: absolute;
            width: 100%; height: 100%;
            background: linear-gradient(to top, #2b1055, #7597de);
            opacity: 0.7;
            z-index: 0;
        }

        .container { 
            position: relative; 
            z-index: 1; 
            width: 100%; 
            max-width: 450px; 
            padding: 20px; 
        }

        .register-box {
            width: 100%; 
            padding: 35px 30px; 
            border-radius: 15px;
            background: rgba(255, 255, 255, 0.15);
            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);
            border: 1px solid rgba(255, 255, 255, 0.3);
            text-align: center; 
            color: white;
            box-shadow: 0 0 30px rgba(0,0,0,0.4);
        }

        .register-box h2 { 
            margin-bottom: 20px; 
            font-size: 26px; 
            font-weight: 600; 
        }

        .alert-messages { list-style: none; margin-bottom: 15px; padding: 0; }
        .alert-messages li {
            background: rgba(239, 68, 68, 0.3);
            border: 1px solid rgba(239, 68, 68, 0.6);
            color: #ffcaca; padding: 8px; border-radius: 6px; font-size: 13px;
        }

        .input-box { position: relative; margin: 18px 0; }
        
        .input-box input, .input-box select {
            width: 100%; 
            padding: 12px 40px 12px 15px;
            border-radius: 30px; 
            border: 1px solid rgba(255, 255, 255, 0.3);
            outline: none; 
            background: rgba(255,255,255,0.1);
            color: white; 
            font-size: 14px;
        }

        .input-box select option {
            background: #2b1055;
            color: white;
        }

        .input-box label {
            position: absolute; 
            top: 50%; left: 15px; 
            transform: translateY(-50%);
            color: #ddd; 
            pointer-events: none; 
            transition: 0.3s; 
            font-size: 14px;
        }

        /* Floating label effect */
        .input-box input:focus ~ label,
        .input-box input:not(:placeholder-shown) ~ label,
        .input-box select:focus ~ label,
        .input-box select:valid ~ label {
            top: -8px; 
            left: 10px; 
            font-size: 11px; 
            color: #fff;
            background: rgba(43, 16, 85, 0.7); 
            padding: 2px 8px; 
            border-radius: 10px;
        }

        .input-box i { 
            position: absolute; 
            right: 15px; 
            top: 50%; 
            transform: translateY(-50%); 
            color: #fff; 
        }

        .vet-fields {
            display: none;
            border-top: 1px dashed rgba(255, 255, 255, 0.3);
            margin-top: 15px;
            padding-top: 10px;
        }

        .btn {
            width: 100%; 
            padding: 12px; 
            border-radius: 30px; 
            border: none;
            background: white; 
            color: #333; 
            font-weight: bold; 
            cursor: pointer; 
            transition: 0.3s;
            margin-top: 10px;
        }

        .btn:hover { background: #ff6a00; color: white; }

        p { margin-top: 15px; font-size: 14px; }
        p a { color: #ffd700; text-decoration: none; }
        p a:hover { text-decoration: underline; }
    </style>
</head>
<body>

<div class="container">
    <div class="register-box">
        <h2>Create Account</h2>

        {% if messages %}
            <ul class="alert-messages">
                {% for message in messages %}
                    <li>{{ message }}</li>
                {% endfor %}
            </ul>
        {% endif %}

        <form method="POST" action="{% url 'register' %}">
            {% csrf_token %}

            <!-- Username -->
            <div class="input-box">
                <input type="text" name="username" placeholder=" " required autocomplete="off">
                <label>Username</label>
                <i class="fa-solid fa-user"></i>
            </div>

            <!-- Email -->
            <div class="input-box">
                <input type="email" name="email" placeholder=" " required>
                <label>Email</label>
                <i class="fa-solid fa-envelope"></i>
            </div>

            <!-- Role Selection -->
            <div class="input-box">
                <select name="role" id="roleSelect" required onchange="toggleVetFields()">
                    <option value="PET_OWNER" selected>Pet Owner</option>
                    <option value="VETERINARIAN">Veterinarian</option>
                </select>
                <label>Account Type</label>
                <i class="fa-solid fa-user-tag"></i>
            </div>

            <!-- Phone -->
            <div class="input-box">
                <input type="text" name="phone" placeholder=" ">
                <label>Phone Number</label>
                <i class="fa-solid fa-phone"></i>
            </div>

            <!-- Dynamic Veterinarian Fields -->
            <div id="vetFields" class="vet-fields">
                <div class="input-box">
                    <input type="text" name="license_number" id="licenseInput" placeholder=" ">
                    <label>License Number</label>
                    <i class="fa-solid fa-id-card"></i>
                </div>

                <div class="input-box">
                    <input type="text" name="specialization" placeholder=" ">
                    <label>Specialization (e.g. Surgery, Dogs)</label>
                    <i class="fa-solid fa-stethoscope"></i>
                </div>
            </div>

            <!-- Password -->
            <div class="input-box">
                <input type="password" name="password" placeholder=" " required>
                <label>Password</label>
                <i class="fa-solid fa-lock"></i>
            </div>

            <!-- Confirm Password -->
            <div class="input-box">
                <input type="password" name="confirm_password" placeholder=" " required>
                <label>Confirm Password</label>
                <i class="fa-solid fa-shield-halved"></i>
            </div>

            <button type="submit" class="btn">Register</button>

            <p>Already have an account? 
                <a href="{% url 'login' %}">Login</a>
            </p>
        </form>
    </div>
</div>

<script>
    function toggleVetFields() {
        const role = document.getElementById("roleSelect").value;
        const vetFields = document.getElementById("vetFields");
        const licenseInput = document.getElementById("licenseInput");

        if (role === "VETERINARIAN") {
            vetFields.style.display = "block";
            licenseInput.required = true;
        } else {
            vetFields.style.display = "none";
            licenseInput.required = false;
        }
    }
</script>

</body>
</html>
