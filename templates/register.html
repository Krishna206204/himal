<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register</title>
    {% load static %}
    <link rel="stylesheet" href="{% static 'style.css' %}">
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #5a88b5;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
        }

        /* ===== Registration Card ===== */
        .register-card {
            background: #fff;
            padding: 40px 30px;
            border: 1px solid #ddd;
            border-radius: 8px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.05);
            width: 350px;
            text-align: center;
        }

        h2 {
            margin-bottom: 15px;
            font-size: 24px;
            color: #111;
        }

        p.subtitle {
            font-size: 14px;
            color: #555;
            margin-bottom: 25px;
        }

        /* ===== Input Fields ===== */
        .register-card input[type="text"],
        .register-card input[type="password"] {
            width: 100%;
            padding: 12px 15px;
            margin-bottom: 15px;
            border: 1px solid #ddd;
            border-radius: 6px;
            font-size: 14px;
            outline: none;
            transition: 0.3s;
        }

        .register-card input:focus {
            border-color: #6200ea;
            box-shadow: 0 0 6px rgba(98,0,234,0.3);
        }

        /* ===== Button ===== */
        .register-card button {
            width: 100%;
            padding: 12px;
            background: #6200ea;
            border: none;
            border-radius: 6px;
            color: white;
            font-size: 16px;
            cursor: pointer;
            transition: 0.3s;
        }

        .register-card button:hover {
            background: #3700b3;
        }

        /* ===== Footer Link ===== */
        .register-card .login-link {
            margin-top: 15px;
            font-size: 13px;
            color: #555;
        }

        .register-card .login-link a {
            color: #6200ea;
            text-decoration: none;
        }

        .register-card .login-link a:hover {
            text-decoration: underline;
        }

        /* ===== Optional Logo ===== */
        .logo {
            margin-top: 30px;
            font-size: 20px;
            font-weight: bold;
            color: #111;
        }

        .logo span {
            color: #e91e63;
            font-family: cursive;
            font-weight: normal;
        }
    </style>
</head>
<body>
    <div class="register-card">
        <h2>Register</h2>
        <p class="subtitle"> fill in this form to register.</p>


        <form method="POST">
            {% csrf_token %}
            <input type="text" name="username" placeholder="Enter username" required>
            <input type="text" name="email" placeholder="Enter email" required>
            <input type="password" name="password" placeholder="Enter password" required>
            <input type="password" name="confirm_password" placeholder="Repeat password" required>

            <button type="submit">Register</button>
        </form>

        <p class="login-link">Already have an account? <a href="{% url 'login' %}">Log in.</a></p>
    </div>
</body>
</html>
