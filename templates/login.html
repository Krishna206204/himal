<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Sign in | Himal Vet Care</title>
    <style>
        * { box-sizing: border-box; }
        body { min-height: 100vh; margin: 0; display: grid; place-items: center; padding: 24px; color: #18302e; background: radial-gradient(circle at 15% 15%, #d7f0e5 0, transparent 30%), #eff6f3; font: 15px/1.5 system-ui, sans-serif; }
        .auth-card { width: min(440px, 100%); padding: clamp(24px, 6vw, 40px); background: white; border: 1px solid #dfe9e6; border-radius: 18px; box-shadow: 0 20px 60px #163d3512; }
        .brand { color: #123c38; text-decoration: none; font-size: 19px; font-weight: 800; letter-spacing: -.04em; }
        .brand span { color: #087f70; }
        h1 { margin: 32px 0 5px; font-size: 30px; letter-spacing: -.04em; }
        .muted { color: #687b79; }
        label { display: block; margin: 0 0 6px; font-weight: 650; }
        input { width: 100%; padding: 12px 13px; border: 1px solid #cbd9d5; border-radius: 8px; font: inherit; }
        .field { margin: 18px 0; }
        .options { display: flex; justify-content: space-between; align-items: center; gap: 12px; margin: 15px 0 20px; }
        .options label { display: flex; align-items: center; gap: 7px; margin: 0; font-size: 13px; font-weight: 400; }
        input[type=checkbox] { width: auto; }
        a { color: #087f70; }
        .options a { font-size: 13px; }
        .button { width: 100%; padding: 12px; border: 0; border-radius: 8px; background: #087f70; color: white; font: inherit; font-weight: 700; cursor: pointer; }
        .messages { padding: 0; list-style: none; }
        .messages li { margin: 8px 0; padding: 10px; color: #8a3030; background: #ffeded; border-radius: 7px; }
        .foot { margin-top: 23px; text-align: center; }
        .foot a { font-weight: 700; }
    </style>
</head>
<body>
<main class="auth-card">
    <a class="brand" href="{% url 'home' %}">Himal <span>Vet Care</span></a>
    <h1>Welcome back</h1>
    <p class="muted">Sign in to manage your pets and clinic visits.</p>
    {% if messages %}<ul class="messages">{% for message in messages %}<li>{{ message }}</li>{% endfor %}</ul>{% endif %}
    <form method="post" action="{% url 'login' %}">
        {% csrf_token %}
        {% if request.GET.next %}<input type="hidden" name="next" value="{{ request.GET.next }}">{% endif %}
        <div class="field"><label for="username">Username</label><input id="username" type="text" name="username" required autocomplete="username" autofocus></div>
        <div class="field"><label for="password">Password</label><input id="password" type="password" name="password" required autocomplete="current-password"></div>
        <div class="options"><label><input type="checkbox" name="remember_me"> Remember me</label><a href="{% url 'forgot_password' %}">Forgot password?</a></div>
        <button class="button" type="submit">Sign in</button>
    </form>
    <p class="foot">New to Himal Vet Care? <a href="{% url 'register' %}">Create an account</a></p>
</main>
</body>
</html>
